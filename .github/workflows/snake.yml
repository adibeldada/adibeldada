name: GitHub Snake Game
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%234b91f1&color_dots=%23ebedf0,%23bfd6f6,%238dbdff,%2364a1f4,%233c7dd9
            dist/github-snake-dark.svg?color_snake=%237C3AED&color_dots=%231a1a2e,%23AFA9EC,%237F77DD,%23534AB7,%233C3489
            dist/ocean.gif?color_snake=%237C3AED&color_dots=%231a1a2e,%23AFA9EC,%237F77DD,%23534AB7,%233C3489&color_background=%230d1117
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update snake animation [skip ci]"
